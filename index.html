  useEffect(()=>{if(loaded)S.set("fn-data",data);},[data,loaded]);

  const add=useCallback((m,e)=>setData(p=>({...p,[m]:[...(p[m]||[]),{...e,id:uid(),createdAt:new Date().toISOString()}]})),[]);

  const total=useMemo(()=>Object.values(data).reduce((s,a)=>s+(Array.isArray(a)?a.length:0),0),[data]);

  if(!loaded) return <div className="ld"><div className="ld-in"><div className="ld-t">Fırat & Nur</div><div className="ld-line"/></div></div>;

  const props={data,add,del};

            {s.m.map(m=><button key={m} className={`sb-btn${mod===m?" sb-act":""}`} onClick={()=>{setMod(m);setNav(false);}}>

            </button>)}

        </header>
        <div className="ct">

  const avgT=mC?(D.mahrem.reduce((s,m)=>s+(+m.tatminSkoru||0),0)/mC).toFixed(1):"-";
  const lK=D.kriz?.length?D.kriz[D.kriz.length-1]:null;
  const dK=lK?Math.floor((Date.now()-new Date(lK.tarih).getTime())/864e5):"∞";
  const uA=ACHS.filter(a=>chkAch(a,D)).length;

  (D.yemek||[]).forEach(e=>acts.push({i:"◆",t:e.mekan||"Yemek",s:e.yemekTuru||"",d:e.tarih||e.createdAt}));
  (D.gezi||[]).forEach(e=>acts.push({i:"△",t:e.lokasyon||"Gezi",s:e.etkinlikTuru||"",d:e.tarih||e.createdAt}));
  (D.kriz||[]).forEach(e=>acts.push({i:"⚡",t:e.konu||"Tartışma",s:"",d:e.tarih||e.createdAt}));
  acts.sort((a,b)=>new Date(b.d||0)-new Date(a.d||0));

    <div style={{marginBottom:32}}><div style={{fontFamily:T.fs,fontSize:32,fontWeight:300,letterSpacing:1}}>Hoş Geldin</div><div style={{fontSize:10,color:T.txD,letterSpacing:2,marginTop:4}}>Fırat & Nur — Hayat Özeti</div></div>

// ─── TMDB ───
const TMDB_KEY="bc01a2399b9defcc77636ac4a4378f31";
const TMDB_IMG="https://image.tmdb.org/t/p/w200";
const TMDB_IMG_LG="https://image.tmdb.org/t/p/w500";

async function tmdbSearch(query, type="movie"){
  const endpoint = type==="movie" ? "search/movie" : "search/tv";
  try{
    const r=await fetch(`https://api.themoviedb.org/3/${endpoint}?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}&language=tr-TR`);
    const d=await r.json();
    return d.results?.slice(0,6)||[];
  }catch{return [];}
}

async function tmdbDetails(id, type="movie"){
  const endpoint = type==="movie" ? `movie/${id}` : `tv/${id}`;
  const creditsEnd = type==="movie" ? `movie/${id}/credits` : `tv/${id}/credits`;
  try{
    const [detR,credR]=await Promise.all([
      fetch(`https://api.themoviedb.org/3/${endpoint}?api_key=${TMDB_KEY}&language=tr-TR`),
      fetch(`https://api.themoviedb.org/3/${creditsEnd}?api_key=${TMDB_KEY}&language=tr-TR`)
    ]);
    const det=await detR.json();
    const cred=await credR.json();
    const director = type==="movie" 
      ? cred.crew?.find(c=>c.job==="Director")?.name||""
      : det.created_by?.map(c=>c.name).join(", ")||"";
    return {
      ad: type==="movie" ? det.title : det.name,
      tur: det.genres?.map(g=>g.name).join(", ")||"",
      yonetmen: director,
      sure: type==="movie" ? det.runtime : det.episode_run_time?.[0]||det.number_of_episodes,
      afis: det.poster_path ? TMDB_IMG_LG+det.poster_path : "",
      tmdbId: det.id,
      tmdbPuan: det.vote_average?.toFixed(1),
      imdbId: det.imdb_id||"",
      yil: (type==="movie"?det.release_date:det.first_air_date)?.slice(0,4)||"",
      ozet: det.overview||"",
      sezonSayisi: type==="tv" ? det.number_of_seasons : null,
    };
  }catch{return null;}
}

function TMDBSearchModal({type,onSelect,onManual,onClose}){
  const [q,setQ]=useState("");
  const [results,setResults]=useState([]);
  const [loading,setLoading]=useState(false);
  const tmdbType = type==="Film"?"movie":"tv";
  const timerRef = useRef(null);

  const doSearch = useCallback(async (query) => {
    if(query.length<2){setResults([]);return;}
    setLoading(true);
    const r = await tmdbSearch(query, tmdbType);
    setResults(r);
    setLoading(false);
  }, [tmdbType]);

  const handleChange = (val) => {
    setQ(val);
    if(timerRef.current) clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => doSearch(val), 400);
  };

  return (
    <div className="ov" onClick={onClose}>

                    {r.vote_average ? ` · TMDB ${r.vote_average.toFixed(1)}` : ""}
                  </div>
                </div>
                <span style={{fontSize:10,color:T.gold}}>Seç →</span>
              </div>

          </div>

      </div>
    </div>
  );
}

  </div>;

  const gen=()=>{const s=[];if(cat==="film"){const f=["Shawshank","Inception","Interstellar","Parasite","Grand Budapest","Spirited Away","Pulp Fiction","Amélie","Whiplash","Dark Knight","Dune","Everything Everywhere"];const g=["Aksiyon","Komedi","Dram","Bilim Kurgu","Korku","Romantik","Animasyon"];for(let i=0;i<5;i++)s.push({name:f[~~(Math.random()*f.length)],genre:g[~~(Math.random()*g.length)]});}else{const f=["Pizza","Sushi","Burger","Kebap","Makarna","Thai","Lahmacun","Waffle","Kokoreç","Ramen","Pide","Taco"];for(let i=0;i<5;i++)s.push({name:f[~~(Math.random()*f.length)]});}setSugs(s);setIdx(0);setFC([]);setNC([]);setMatch(null);setPlayer("firat");};
  const swipe=dir=>{const c={idx,liked:dir==="r"};if(player==="firat"){const nc=[...fC,c];setFC(nc);if(idx<sugs.length-1)setIdx(idx+1);else{setPlayer("nur");setIdx(0);}}else{const nc=[...nC,c];setNC(nc);if(idx<sugs.length-1)setIdx(idx+1);else{const fl=fC.filter(x=>x.liked).map(x=>x.idx),nl=nc.filter(x=>x.liked).map(x=>x.idx),m=fl.filter(i=>nl.includes(i));setMatch(m.length?sugs[m[0]]:{name:"Eşleşme yok!",no:true});}}};

      <div className="card" style={{textAlign:"center",padding:40}}>
        <div style={{fontFamily:T.fs,fontSize:22,fontWeight:400}}>{sugs[idx]?.name}</div>

// ─── AI ───
function AIMod({D}){
  const [report,setReport]=useState(null);const [loading,setLoading]=useState(false);
  const gen=()=>{setLoading(true);setTimeout(()=>{
    const mC=D.mahrem?.length||0;const avgT=mC?(D.mahrem.reduce((s,m)=>s+(+m.tatminSkoru||0),0)/mC).toFixed(1):null;
    const lK=D.kriz?.length?D.kriz[D.kriz.length-1]:null;const dK=lK?Math.floor((Date.now()-new Date(lK.tarih).getTime())/864e5):null;
    const tA=D.gezi?.reduce((s,g)=>s+(+g.adimSayisi||0),0)||0;const fC=(D.sinema?.length||0)+(D.dizi?.length||0);
    const L=["Merhaba Fırat ve Nur!","","Bu haftanın özeti:",""];
    const rY=(D.yemek||[]).filter(y=>{const d=new Date(y.tarih||y.createdAt);return Date.now()-d.getTime()<7*864e5;}).length;
    if(rY>=3)L.push(`Bu hafta ${rY} kez dışarıdan yemek söylemişsiniz. Bütçe ağlıyor.`);
    else if(rY===0&&(D.yemek?.length||0)>0)L.push("Bu hafta hiç dışarıda yememişsiniz. Ev yemeği şampiyonları!");
    if(tA>0)L.push(tA<30000?`${tA.toLocaleString()} adım. Biraz daha yürüyüş.`:`${tA.toLocaleString()} adım, harika!`);
    if(avgT)L.push(+avgT>=8?`Mahrem skorlar iyi (${avgT}/10).`:+avgT>=5?`Mahrem ortalama (${avgT}/10). Bu akşam telefonları kapatın.`:`Mahrem düşüşte (${avgT}/10). Romantik zaman ayırın.`);
    if(dK!==null)L.push(dK===0?"Bugün tartışmışsınız. Sarılın.":dK>30?`${dK} gündür barış! Rekor.`:`${dK} gündür tartışma yok.`);
    if(fC>0)L.push(`Toplamda ${fC} eser izlemişsiniz.`);
    L.push("");L.push("— AI Asistanınız");setReport(L.join("\n"));setLoading(false);
  },1500);};
  return <div>
    <div className="ph"><div><div className="ph-t">AI Asistan</div><div className="ph-s">İlişki analitiği</div></div></div>
    <div className="card" style={{marginBottom:12}}><div style={{fontFamily:T.fs,fontSize:16,marginBottom:8}}>Haftalık Rapor</div><div style={{fontSize:11,color:T.txM,marginBottom:14}}>Tüm verilerinizi analiz edip özel özet sunar.</div><button className="btn btn-p" onClick={gen} disabled={loading}>{loading?"Analiz ediliyor...":"Rapor Oluştur"}</button></div>
    {report&&<div className="card" style={{background:`${T.info}08`,borderColor:`${T.info}18`}}><div style={{whiteSpace:"pre-wrap",fontSize:12,lineHeight:1.8,color:T.txM}}>{report}</div></div>}
    <div className="grid" style={{gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",marginTop:12}}>{[["Günün Sorusu","Senkronize soru"],["Özel Gün","Yıl dönümü hatırlatma"],["Trend","Puanlar yükseliyor mu?"]].map(([t,d])=><div key={t} className="card"><div style={{fontFamily:T.fs,fontSize:14}}>{t}</div><div style={{fontSize:10,color:T.txD,marginTop:4}}>{d}</div></div>)}</div>
  </div>;
}

    {show&&<FormModal title="Fotoğraf Ekle" fields={flds} onSubmit={onA} onClose={()=>setShow(false)}/>}
  </div>;
}

// ─── NORALIST (Yapılacaklar + Alışveriş + Dilek) ───
function NoraListMod({d,onA,onD,update}){
  const [show,setShow]=useState(false);
  const [tab,setTab]=useState("yapilacak");
  const flds=[
    {k:"madde",l:"Madde"},{k:"kategori",l:"Kategori",t:"select",o:["Yapılacaklar","Alışveriş","Dilek/İstek"]},
    {k:"oncelik",l:"Öncelik",t:"select",o:["Düşük","Normal","Yüksek","Acil"]},
    {k:"sorumlu",l:"Sorumlu",t:"select",o:["Fırat","Nur","Birlikte"]},{k:"not",l:"Not",t:"textarea"},
  ];
  const catMap={"yapilacak":"Yapılacaklar","alisveris":"Alışveriş","dilek":"Dilek/İstek"};
  const filtered=tab==="all"?d:d.filter(e=>e.kategori===catMap[tab]);
  const toggle=(id)=>{const item=d.find(e=>e.id===id);if(item)update(id,{done:!item.done});};
  return <div>
    <div className="ph"><div><div className="ph-t">NoraList</div><div className="ph-s">{d.length} madde · {d.filter(e=>e.done).length} tamamlandı</div></div>
      <button className="btn btn-p" onClick={()=>setShow(true)}>+ Ekle</button></div>
    <div style={{display:"flex",gap:0,marginBottom:16,borderBottom:`1px solid ${T.border}`}}>
      {[["yapilacak","Yapılacaklar"],["alisveris","Alışveriş"],["dilek","Dilek"],["all","Tümü"]].map(([k,l])=>
        <button key={k} onClick={()=>setTab(k)} style={{padding:"8px 14px",background:"none",border:"none",borderBottom:tab===k?`2px solid ${T.gold}`:"2px solid transparent",color:tab===k?T.goldB:T.txD,fontFamily:T.f,fontSize:11,cursor:"pointer"}}>{l}</button>
      )}
    </div>
    <EList entries={filtered} onD={onD} render={e=> <div style={{display:"flex",alignItems:"center",gap:12}}>
      <button onClick={()=>toggle(e.id)} style={{width:20,height:20,borderRadius:4,border:`1px solid ${e.done?T.ok:T.border}`,background:e.done?`${T.ok}20`:"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:T.ok,flexShrink:0}}>{e.done?"✓":""}</button>
      <div style={{flex:1,opacity:e.done?.5:1}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <span style={{...({fontFamily:T.fs,fontSize:15,fontWeight:500}),textDecoration:e.done?"line-through":"none"}}>{e.madde||"Madde"}</span>
          {e.oncelik&&e.oncelik!=="Normal"&&<Tag c={e.oncelik==="Acil"?T.err:e.oncelik==="Yüksek"?T.gold:T.txD}>{e.oncelik}</Tag>}
          {e.sorumlu&&<Tag>{e.sorumlu}</Tag>}
        </div>
        {e.not&&<div style={{fontSize:10,color:T.txD,marginTop:2}}>{e.not}</div>}
      </div>
    </div>}/>
    {show&&<FormModal title="Listeye Ekle" fields={flds} onSubmit={onA} onClose={()=>setShow(false)}/>}
  </div>;
}

// ─── FATUNORA (Fatura Takibi + Dekont + Hatırlatma) ───
function FatuNoraMod({d,onA,onD}){
  const [show,setShow]=useState(false);
  const [tab,setTab]=useState("aktif");
  const flds=[
    {k:"faturaAdi",l:"Fatura Adı",p:"Elektrik, su, internet..."},{k:"kurum",l:"Kurum",p:"BEDAŞ, İSKİ..."},
    {k:"tutar",l:"Tutar (₺)",t:"number"},{k:"sonOdeme",l:"Son Ödeme Tarihi",t:"date"},
    {k:"periyot",l:"Periyot",t:"select",o:["Aylık","2 Aylık","Yıllık","Tek Seferlik"]},
    {k:"odemeYontemi",l:"Ödeme Yöntemi",t:"select",o:["Otomatik","Manuel","Kredi Kartı","Havale"]},
    {k:"dekontUrl",l:"Dekont URL / Fotoğraf",p:"https://..."},{k:"durum",l:"Durum",t:"select",o:["Ödenmedi","Ödendi","Gecikmiş"]},
    {k:"not",l:"Not",t:"textarea"},
  ];
  const now=new Date();
  const aktif=d.filter(e=>e.durum!=="Ödendi");
  const odenmis=d.filter(e=>e.durum==="Ödendi");
  const yaklasan=aktif.filter(e=>{if(!e.sonOdeme)return false;const diff=Math.floor((new Date(e.sonOdeme)-now)/(864e5));return diff>=0&&diff<=7;});
  const geciken=aktif.filter(e=>{if(!e.sonOdeme)return false;return new Date(e.sonOdeme)<now;});
  const filtered=tab==="aktif"?aktif:tab==="odenmis"?odenmis:d;

  return <div>
    <div className="ph"><div><div className="ph-t">FatuNora</div><div className="ph-s">{d.length} fatura · {aktif.length} bekliyor</div></div>
      <button className="btn btn-p" onClick={()=>setShow(true)}>+ Fatura</button></div>

    {/* Uyarılar */}
    {geciken.length>0&&<div className="card" style={{background:`${T.err}10`,borderColor:`${T.err}25`,marginBottom:12}}>
      <div style={{fontSize:11,color:T.err,fontWeight:500}}>⚠ {geciken.length} fatura gecikmiş!</div>
      {geciken.map(e=><div key={e.id} style={{fontSize:11,color:T.err,marginTop:4}}>• {e.faturaAdi} — son ödeme: {fmtD(e.sonOdeme)} {e.tutar?`(${e.tutar}₺)`:""}</div>)}
    </div>}
    {yaklasan.length>0&&<div className="card" style={{background:`${T.gold}08`,borderColor:`${T.gold}20`,marginBottom:12}}>
      <div style={{fontSize:11,color:T.gold,fontWeight:500}}>🔔 {yaklasan.length} fatura bu hafta sona eriyor</div>
      {yaklasan.map(e=><div key={e.id} style={{fontSize:11,color:T.gold,marginTop:4}}>• {e.faturaAdi} — {fmtD(e.sonOdeme)} {e.tutar?`(${e.tutar}₺)`:""}</div>)}
    </div>}

    <div style={{display:"flex",gap:0,marginBottom:16,borderBottom:`1px solid ${T.border}`}}>
      {[["aktif","Bekleyen"],["odenmis","Ödenen"],["all","Tümü"]].map(([k,l])=>
        <button key={k} onClick={()=>setTab(k)} style={{padding:"8px 14px",background:"none",border:"none",borderBottom:tab===k?`2px solid ${T.gold}`:"2px solid transparent",color:tab===k?T.goldB:T.txD,fontFamily:T.f,fontSize:11,cursor:"pointer"}}>{l}</button>
      )}
    </div>

    <EList entries={filtered} onD={onD} render={e=>{
      const isLate=e.sonOdeme&&e.durum!=="Ödendi"&&new Date(e.sonOdeme)<now;
      return <div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <span className="e-t">{e.faturaAdi||"Fatura"}</span>
          {e.durum&&<Tag c={e.durum==="Ödendi"?T.ok:isLate?T.err:T.gold}>{isLate?"Gecikmiş":e.durum}</Tag>}
          {e.periyot&&<Tag c={T.txD}>{e.periyot}</Tag>}
        </div>
        <div className="e-row">
          {e.kurum&&<span>{e.kurum}</span>}
          {e.tutar&&<span style={{fontFamily:T.fm,color:T.goldB}}>{e.tutar}₺</span>}
          {e.odemeYontemi&&<span>{e.odemeYontemi}</span>}
        </div>
        {e.sonOdeme&&<div style={{fontSize:11,color:isLate?T.err:T.txM,marginTop:4}}>Son ödeme: {fmtD(e.sonOdeme)}</div>}
        {e.dekontUrl&&<a href={e.dekontUrl.startsWith("http")?e.dekontUrl:`https://${e.dekontUrl}`} target="_blank" rel="noopener noreferrer" style={{fontSize:11,color:T.info,marginTop:4,display:"block",textDecoration:"none"}}>📎 Dekont görüntüle</a>}
        {e.not&&<div style={{fontSize:10,color:T.txD,marginTop:4}}>{e.not}</div>}
      </div>;
    }}/>
    {show&&<FormModal title="Fatura Ekle" fields={flds} onSubmit={onA} onClose={()=>setShow(false)}/>}
  </div>;
}
